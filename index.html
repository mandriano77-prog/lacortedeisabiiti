<!DOCTYPE html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --corten:#A0502D; --petrolio:#204858; --avorio:#EDE2CA; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'Inter',sans-serif; font-weight:400; color:var(--avorio);
    background:var(--corten); -webkit-font-smoothing:antialiased;
    min-height:100vh; min-height:100dvh; position:relative; overflow-x:hidden;
  }
  .bg {
    position:fixed; inset:-40px; z-index:0;
    background:url('img/via_marconi_epoca.jpg') center/cover no-repeat;
    filter:blur(6px) sepia(.2);
  }
  .velo {
    position:fixed; inset:0; z-index:1;
    background:
      radial-gradient(ellipse at center, rgba(160,80,45,.65) 0%, rgba(160,80,45,.86) 85%);
  }
  main {
    position:relative; z-index:2; min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:48px 24px 40px; text-align:center;
  }
  .logo { height:min(54vh,500px); width:auto; max-width:78vw; object-fit:contain; }
  .linea { width:56px; height:1px; background:var(--avorio); opacity:.7; margin:34px auto 22px; }
  .stato { font-size:12px; letter-spacing:4px; text-transform:uppercase; font-weight:400; opacity:.9; }
  .contatti { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:28px; }
  .contatti a {
    display:inline-flex; flex-direction:column; align-items:center; gap:2px;
    min-width:150px; padding:13px 22px; text-decoration:none; color:var(--avorio);
    border:1px solid rgba(237,226,202,.55); background:rgba(110,50,25,.38);
    backdrop-filter:blur(4px); transition:background .2s, border-color .2s;
  }
  .contatti a:hover, .contatti a:focus-visible { background:var(--petrolio); border-color:var(--petrolio); outline:none; }
  .contatti small { font-size:10px; letter-spacing:3px; text-transform:uppercase; opacity:.9; }
  .contatti span { font-size:15px; font-weight:400; letter-spacing:.3px; }
  .indirizzo { margin-top:30px; font-size:12px; letter-spacing:2.5px; text-transform:uppercase; opacity:.9; line-height:1.9; }
  .indirizzo a { color:inherit; text-decoration:none; border-bottom:1px solid rgba(237,226,202,.35); }
  @media (max-width:560px) {
    .logo { height:min(44vh,380px); }
    .contatti { flex-direction:column; align-items:stretch; width:100%; max-width:320px; }
    .contatti a { min-width:0; }
  }
  @media (prefers-reduced-motion:no-preference) {
    main > * { animation:entra .9s ease both; }
    main > *:nth-child(2) { animation-delay:.12s; } main > *:nth-child(3) { animation-delay:.2s; }
    main > *:nth-child(4) { animation-delay:.3s; } main > *:nth-child(5) { animation-delay:.4s; }
    @keyframes entra { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="velo" aria-hidden="true"></div>
<main>
  <img class="logo" src="logo_avorio.png" alt="La Corte dei Sabiìti — Cucina tradizionale">
  <div class="linea"></div>

  <div class="contatti">

    <a href="https://wa.me/393758791522" target="_blank" rel="noopener"><small>WhatsApp</small><span>375 879 1522</span></a>

    <a href="mailto:prenotazioni@lacortedeisabiiti.com"><small>Prenotazioni</small><span>prenotazioni@lacortedeisabiiti.com</span></a>
  </div>
  <p class="indirizzo">Via Marconi 5 · 22078 Turate (CO)<br><a href="https://www.instagram.com/lacortedeisabiiti/" target="_blank" rel="noopener">Instagram</a></p>
</main>
</body>
</html>
